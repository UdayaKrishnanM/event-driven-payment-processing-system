# One command starts everything:   docker compose up -d --build
#
#   Kafka UI ............ http://localhost:8080
#   payment-service ..... http://localhost:8081/swagger-ui.html
#   ledger-service ...... http://localhost:8082/swagger-ui.html
#   notification-service  http://localhost:8083/swagger-ui.html
#
# Kafka is reachable from your machine on localhost:9094 (for running a service from IntelliJ),
# and from other containers on kafka:9092.

name: edps

x-service-env: &service-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  DB_URL: jdbc:postgresql://postgres:5432/payments
  JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"

x-service-deps: &service-deps
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: edps-kafka
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created by the services (3 partitions each)
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"       # keeps memory low on laptops
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    restart: unless-stopped
    healthcheck:
      # Cheap check: is the broker accepting connections on 9092? (no extra JVM, works on slow laptops)
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: edps-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: edps-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: edps-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  payment-service:
    build:
      context: .
      target: payment-service
    image: edps/payment-service:local
    container_name: edps-payment-service
    ports:
      - "8081:8081"
    environment:
      <<: *service-env
      DB_USER: payment_svc
      DB_PASSWORD: payment_pwd
      REDIS_HOST: redis
      CARD_FINGERPRINT_SECRET: docker-local-secret-change-me
    depends_on:
      <<: *service-deps
      redis:
        condition: service_healthy
    healthcheck: &app-health
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  ledger-service:
    build:
      context: .
      target: ledger-service
    image: edps/ledger-service:local
    container_name: edps-ledger-service
    ports:
      - "8082:8082"
    environment:
      <<: *service-env
      DB_USER: ledger_svc
      DB_PASSWORD: ledger_pwd
      # Demo: set to a merchant id (e.g. MER-DLT-DEMO) to make the ledger fail for it -> retries -> DLT.
      # Can also be changed at runtime: PUT http://localhost:8082/api/v1/admin/chaos
      LEDGER_CHAOS_FAIL_MERCHANT_ID: ""
    depends_on: *service-deps
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health/readiness || exit 1"]

  notification-service:
    build:
      context: .
      target: notification-service
    image: edps/notification-service:local
    container_name: edps-notification-service
    ports:
      - "8083:8083"
    environment:
      <<: *service-env
      DB_USER: notification_svc
      DB_PASSWORD: notification_pwd
    depends_on: *service-deps
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/actuator/health/readiness || exit 1"]

volumes:
  postgres-data:
